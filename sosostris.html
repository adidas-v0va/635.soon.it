<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Madame Sosostris</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: one dark room. Question and spread on top, the table of cards below, then the reading in fragments, stepped like verse. */
:root{
  --void:#07030d; --deep:#150827; --violet:#5a1e9e; --magenta:#d62fcf; --hot:#ff5ee0; --bone:#d8cde6; --dim:#9585ad; --ink:#1b0a2e;
  --px:'Press Start 2P',ui-monospace,monospace; --serif:'EB Garamond',Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--void);color:var(--bone);font:400 19px/1.55 var(--serif);
  padding-block:18px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
#fog{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.5;pointer-events:none;z-index:0}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(0,0,0,.7) 100%)}
main{position:relative;z-index:1;max-width:860px;margin-inline:auto}
.px{font:400 10px/1.7 var(--px);text-transform:uppercase;letter-spacing:.04em}
.dim{color:var(--dim)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#ask{display:grid;gap:12px;margin-top:34px;max-width:520px}
input{width:100%;background:var(--deep);border:2px solid var(--violet);color:var(--bone);font:italic 400 20px/1.3 var(--serif);padding:12px 14px;border-radius:0}
input::placeholder{color:var(--dim)}
input:focus{outline:none;border-color:var(--hot)}
button{font-family:var(--px);border-radius:0;cursor:pointer}
button:focus-visible{outline:2px dotted var(--bone);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.opt,.ghost{font-size:10px;line-height:1.6;text-transform:uppercase;padding:12px 14px;border:2px solid var(--violet);background:transparent;color:var(--dim)}
.opt[aria-pressed=true]{border-color:var(--hot);color:var(--bone);background:var(--deep)}
.ghost{padding:8px 10px;font-size:9px}
.ghost[aria-pressed=true]{color:var(--hot);border-color:var(--hot)}
.main{justify-self:start;font-size:12px;text-transform:uppercase;padding:14px 18px;background:var(--magenta);color:var(--void);border:2px solid var(--hot);box-shadow:4px 4px 0 var(--violet)}
.main:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--violet)}
#table{margin-top:44px;scroll-margin-top:12px}
#echo{margin:0 0 6px;font-style:italic;color:var(--bone)}
#open{margin:0 0 6px;font-style:italic;color:var(--dim);max-width:34em}
#stage{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px;max-width:var(--mw,660px);margin-top:14px}
.cell{display:grid;gap:8px;justify-items:start;min-width:0;width:100%}
.slot{position:relative;width:100%;aspect-ratio:112/206;padding:0;border:2px solid var(--violet);background:var(--deep);box-shadow:0 0 28px rgba(214,47,207,.22);animation:jit 2.4s steps(1) infinite;overflow:hidden}
.cell:nth-child(2) .slot{animation-delay:.8s}.cell:nth-child(3) .slot{animation-delay:1.6s}
@keyframes jit{0%,100%{transform:none}50%{transform:translate(1px,-1px)}}
.slot:hover,.slot:focus-visible{border-color:var(--hot)}
.slot[data-open]{border-color:var(--magenta);animation:none;cursor:default}
.face{position:absolute;inset:0;container-type:inline-size}
.face canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.slot.rev .face{transform:rotate(180deg)}
.num,.ttl{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink);font-family:var(--serif);font-weight:500;text-transform:uppercase;letter-spacing:.07em;line-height:1.05}
.num{top:0;height:6.8%;font-size:6.2cqw}
.ttl{bottom:0;height:9.7%;font-size:5.9cqw;padding-inline:3%}
#hint{margin:14px 0 0}
#frags{display:grid;gap:30px;margin-top:30px}
.frag{max-width:34em}
.frag:nth-child(3n+2){margin-left:clamp(0px,7vw,56px)}
.frag:nth-child(3n+3){margin-left:clamp(0px,14vw,112px)}
.frag .note{margin-top:8px;font-style:italic;font-size:18px;color:var(--dim)}
.frag .pos{color:var(--hot)}
.frag h3{margin:6px 0 6px;font:italic 500 clamp(27px,6vw,36px)/1.15 var(--serif)}
.frag h3 small{font:400 9px/1 var(--px);text-transform:uppercase;color:var(--dim);margin-left:10px;letter-spacing:.04em;white-space:nowrap}
.frag p{margin:0;font-size:21px}
#coda{margin-top:38px;padding-top:18px;border-top:1px dashed var(--violet);max-width:34em;color:var(--dim);font-style:italic;font-size:21px}
#coda p{margin:8px 0 0}
#coda p.combo{color:var(--bone)}
#again{margin-top:26px}
#stage.celtic{grid-template-columns:repeat(4,minmax(112px,152px));justify-content:start;overflow-x:auto;padding-bottom:8px;max-width:100%}
.cell.cross{z-index:2;pointer-events:none;align-self:start;margin-top:25%;justify-self:center;width:66%}
.cell.cross .px{display:none}
.cell.cross .slot{pointer-events:auto;transform:rotate(90deg);animation:none}
.slot.gl{animation:shake .09s steps(2) infinite}
@keyframes shake{0%{transform:translate(-3px,1px)}100%{transform:translate(3px,-2px)}}
.cell.cross .slot.gl{animation:none}
@media (prefers-reduced-motion:reduce){.slot{animation:none}}
</style>

<canvas id="fog" aria-hidden="true"></canvas>
<main>
  <div class="top">
    <span id="day" class="px dim">Day 001</span>
    <button id="snd" class="ghost" aria-pressed="false">Sound: off</button>
  </div>

  <section id="ask">
    <label for="q" class="px dim">Ask, if thou still canst</label>
    <input id="q" maxlength="140" autocomplete="off" placeholder="what wouldst thou rather not know?">
    <div class="row" role="group" aria-label="Spread">
      <button class="opt" data-n="1" aria-pressed="false">One card</button>
      <button class="opt" data-n="3" aria-pressed="true">Three cards</button>
      <button class="opt" data-n="5" aria-pressed="false">Five cards</button>
      <button class="opt" data-n="10" aria-pressed="false">Celtic cross</button>
      <button class="opt" id="rv" aria-pressed="true">Reversals: yes</button>
    </div>
    <button id="go" class="main">Draw</button>
  </section>

  <section id="table" hidden>
    <p id="echo"></p>
    <p id="open"></p>
    <div id="stage"></div>
    <p id="hint" class="px dim">Touch a card to turn it</p>
    <div id="frags" aria-live="polite"></div>
    <div id="coda" hidden></div>
    <button id="again" class="main" hidden>Draw again</button>
  </section>
</main>

function art(cv,k,g,salt){
  if(!sprCtx){sprWait.push(()=>art(cv,k,g,salt));return}
  cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d'),im=sprCtx.getImageData((k%NCOL)*W,Math.floor(k/NCOL)*H,W,H),d=im.data;
  if(g>0){
    const G=rng(k*31+(salt|0)+5),nb=4+Math.floor(g*7);
    for(let b=0;b<nb;b++){const y0=G()*H|0,hh=1+(G()*(5+g*8)|0),s=(G()-.5)*(12+g*36)|0;
      for(let y=y0;y<Math.min(H,y0+hh);y++){const row=d.slice(y*W*4,(y+1)*W*4);for(let X=0;X<W;X++){const sx=(((X-s)%W)+W)%W;for(let c=0;c<3;c++)d[(y*W+X)*4+c]=row[sx*4+c]}}}
    for(let c=0;c<20+g*200;c++){const o=((G()*H|0)*W+(G()*W|0))*4,q=[HT,FR,K,[160,60,230]][G()*4|0];d[o]=q[0];d[o+1]=q[1];d[o+2]=q[2]}
    if(g>1.2){const cp=d.slice(),sx=Math.round(g*1.6);
      for(let y=0;y<H;y++){const j=(G()<.3)?Math.round((G()-.5)*g*6):0;for(let X=0;X<W;X++){const o=(y*W+X)*4,a=(((X-sx+j)%W)+W)%W,b=(((X+sx-j)%W)+W)%W;d[o]=cp[(y*W+a)*4];d[o+2]=cp[(y*W+b)*4+2]}}}
    if(g>2.6&&(salt&1)){for(let i=0;i<d.length;i+=4){d[i]=Math.min(255,d[i]*1.3+60);d[i+1]=d[i+1]*.5;d[i+2]=Math.min(255,d[i+2]*1.2+40)}}
    for(let i=0;i<d.length;i+=4){const m=Math.min(d[i],d[i+2])*.85+8;if(d[i+1]>m)d[i+1]=m}
  }
  ctx.putImageData(im,0,0);
}

    const dx=X-W/2,dy=y-H/2,rr=Math.hypot(dx,dy*.62),o=(y*W+X)*4;

function comboLines(cards){
  const out=[],ks=cards.map(c=>c.k),set=new Set(ks);
  for(let a=0;a<ks.length;a++)for(let b=a+1;b<ks.length;b++){const key=[ks[a],ks[b]].sort((x,y)=>x-y).join(',');if(COMBO[key])out.push(COMBO[key])}
  const maj=ks.filter(k=>k<22).length,n=ks.length;
  if(n>=3&&maj>=Math.ceil(n*.7))out.push("So many of the greater cards. The matter is larger than thee, dear.");
  if(n>=3&&maj===0)out.push("Not one greater card. The matter is small, and therefore thine own.");
  if(n>=3&&cards.filter(c=>c.rev).length>=Math.ceil(n*.7))out.push("Nearly all of them upside down. Either the room is the wrong way up, or thou art.");
  if(ks.filter(k=>k>=22&&(k-22)%14===0).length>=2)out.push("Aces, and aces. Beginnings by the handful, and none of them kept.");
  [22,36,50,64].forEach((s,i)=>{if(n>=3&&ks.filter(k=>k>=s&&k<s+14).length>=3)out.push("Three of one suit: the cards agree, and agreement frightens her.")});
  return out.slice(0,3);
}
